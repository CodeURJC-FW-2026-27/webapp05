{{> header}}
    
    <!-- Section-->
    <section class="py-5">
        <div class="container px-4 px-lg-5 my-5">


            <!--Second Entity-->
            <div class="row gx-4 gx-lg-5">
                <div class="col-lg-8 offset-lg-2">
                    <h3 class="fw-bolder mb-4">Administration</h3>

                    <!--Add Review Form-->
                    <div class="card bg-light p-4">
                        <h4 class="card-title mb-3">Add new movie </h4>
                       <form action="{{action}}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="movieTitle" class="form-label">Title</label>
                                <input type="text" class="form-control" id="movieTitle" name="movieTitle" value="{{movie.title}}"
                                     placeholder="Enter the movie title" maxlength="100" required />
                            </div>
                            <div class="mb-3">
                                <label for="movieYear" class="form-label">Year</label>
                                <input type="date" class="form-control" id="movieYear" name="movieYear" value="{{movie.year}}"
                                        min="1888-01-01" max="2100-12-31" required />
                            </div>
                            <div class="mb-3">
                                <label for="ageRating" class="form-label">Age rating</label>
                                <select class="form-select mb-2" id="ageRating" name="ageRating" required>
                                    <option value="" disabled {{#noAgeRating}} selected {{/noAgeRating}}>Select age rating</option>
                                    {{#options}}
                                    <option value="{{value}}" {{#selected}} selected {{/selected}}>{{label}}</option>
                                    {{/options}}
                                </select>

                            </div>
                             <div class="mb-3">
                                <label for="genre" class="form-label">Genre</label>
                                <select class="form-select mb-2" id="genre" name="genre"  required>
                                    <option value="" disabled {{#noGenre}} selected {{/noGenre}}>Select genre</option>
                                    {{#genreOptions}}
                                    <option value="{{value}}" {{#selectedGenre}} selected {{/selectedGenre}}>{{label}}</option>
                                    {{/genreOptions}}
                                </select>

                            </div>
                            <div class="mb-3">
                                <label for="synopsis" class="form-label">Synopsis</label>
                                <textarea class="form-control" id="synopsis" name="synopsis" rows="3"
                                 placeholder="Write the synopsis movie" minlength="10" maxlength="1000" required>{{movie.synopsis}}</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="platforms" class="form-label">Avaible in</label>
                                <select multiple class="form-select mb-2" id="platforms" name="platforms">
                                    <option value="" disabled {{#noPlatforms}} selected {{/noPlatforms}}>Select Platforms</option>
                                    {{#platformsOptions}}
                                    <option value="{{value}}" {{#selectedPlatform}} selected {{/selectedPlatform}}>{{label}}</option>
                                    {{/platformsOptions}}

                                </select>

                            </div>
                            <div class="mb-3">
                                <label for="duration" class="form-label">Duration</label>
                                <input type="number" class="form-control" id="duration" name="duration" value="{{movie.duration}}"
                                    placeholder="Duration in minutes" min="1" max="600" step="1" required />
                            </div>
                            <div class="mb-3">
                                <label for="director" class="form-label">Director</label>
                                <input type="text" class="form-control" id="director" name="director" value="{{movie.director}}"
                                 placeholder="Enter the director name" maxlength="100" required />
                            </div>
                            <div class="mb-3">
                                <label for="cast" class="form-label">Cast</label>
                                <textarea class="form-control" id="cast" name="cast" rows="3"
                                placeholder="Write the actors from the movie" maxlength="500" required>{{movie.cast}}</textarea>
                            </div>
                            
                            {{#hasImage}}
                            <div class="mb-3">
                         <img class="card-img-top" src="{{movie.frontpage}}" alt="{{movie.title}}" />
                            </div>
                            {{/hasImage}}
                            {{^hasImage}}
                             <img class="card-img-top" src="/movie/{{movie._id}}/image" alt="{{movie.title}}" />
                            {{/hasImage}}
                            <div class="mb-3">
                                <label for="image" class="form-label">Front Page</label>
                           <input type="file" class="form-control" id="frontpage" name="frontpage" accept="image/png, image/jpeg" />
                            </div>
                            <button type="submit" class="btn btn-success"><i class="bi bi-check me-1"></i> Save</button>
                            <a class="btn btne btn-danger" href="{{actionCancel}}"><i class="bi bi-arrow-bar-left me-1"></i> Cancel</a>
                        </form>
                    </div>
                </div>


            </div>

        </div>
    </section>
    {{> footer}}
