{{> header}}
        
        <!-- Section-->
        <section class="py-5">
            <div class="container px-4 px-lg-5 mt-5">
                <div class="d-flex justify-content-end mb-4">
                <a href="/movie/new" class="btn btn-dark boton-rojo">Crear nuevo elemento</a> 
                </div>
                <div class="row gx-4 gx-lg-5 row-cols-1 row-cols-md-2 row-cols-lg-3 justify-content-center">
  {{#movies}}
    <div class="col mb-5">
        <div class="card h-100">
            <!-- Product image -->
            <a href="/movie/{{_id}}">
                <img class="card-img-top" src="{{frontpage}}" alt="{{title}}" />
            </a>
            <!-- Product details -->
            <div class="card-body p-4">
                <div class="text-center">
                    <!-- Product name -->
                    <h5 class="fw-bolder">{{title}}</h5>
                </div>
            </div>
        </div>
    </div>
    {{/movies}}
<!-- Si la lista de películas está vacía, muestra este aviso-->
    {{^movies}}
<div class="col-12 text-center py-5">
    <div class="alert alert-warning" role="alert">
        No movie has been found.
    </div>
</div>
{{/movies}}
</div>
            </div>
        </section>
        {{> footer}}
