<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Obsession</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body>
       <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="col-2 px-4 px-lg-5"><span class="navbar-brand">QVV 🧀🍿</span></div> 
            <div class="input-group px-4  mx-4 ">
                <input type="search" placeholder="¿Qué quieres ver este viernes?" class="nav-search-input form-control"/><button class="btn btn-dark"><i class="bi bi-search"></i></button>
            </div>
            <div class="container col-3 px-lg-5">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 ms-lg-4">
                        

                        <li class="nav-item"><a class="nav-link" aria-current="page" href="index.html"><i class="bi bi-house"></i></a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-filter-square"></i><a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="index.html">All movies</a></li>
                                <li><hr class="dropdown-divider" /></li>
                                <li><a class="dropdown-item" href="">Action</a></li>
                                <li><a class="dropdown-item" href="">Comedy</a></li>
                                 <li><a class="dropdown-item" href="">Romance</a></li>
                                <li><a class="dropdown-item" href="">Sci-fi</a></li>
                                <li><a class="dropdown-item" href="">Terror</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- Header-->
       <header class="masthead py-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Que Ver Un Viernes 🧀🍿</h1>
                </div>
            </div>
        </header>
       <section class="py-5">
       <div class="container px-4 px-lg-5">
         <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="card bg-light p-4">
                    <h4 class="card-title mb-3">Edit a Review of {{movieTitle}}</h4>
                    <form action="{{action}}" method="post">
                      <div class="mb-3">
                        <label for="reviewerName" class="form-label">Your Name</label>
                        <input type="text" class="form-control" id="reviewerName" name="author" value="{{reviewerName}}" placeholder="Enter your name" required />
                      </div>
                      <div class="mb-3">
                        <label for="reviewTitle" class="form-label">Review Title</label>
                        <input type="text" class="form-control" id="reviewTitle" name="title" maxlength="100" value="{{title}}" placeholder="Enter a title for your review" required />
                      </div>
                      <div class="mb-3">
                        <label for="reviewRating" class="form-label">Your Rating</label>
                        <select class="form-select mb-2" id="reviewRating" name="rating" required>
                            <option value="" disabled {{#noRating}} selected {{/noRating}}>Select a rating</option>
                           {{#ratingOptions}}
                            <option value="{{value}}" {{#isSelected}} selected {{/isSelected}}>{{label}} Stars</option>
                           {{/ratingOptions}}
                        </select>
                      </div>
                      <div class="mb-3">
                        <label for="reviewText" class="form-label">Your Review</label>
                        <textarea class="form-control" id="reviewText" name="text" rows="3" minlength="10" maxlength="500" placeholder="Write your review here..." required>{{reviewText}}</textarea>
                      </div>
                      <button type="submit" class="btn btn-primary">Update Review</button>
                      <a class="btn btn-secondary" href="/movie/{{movie._id}}">Cancel</a>
                    </form>
                </div>
            </div>
         </div>
         </div>
         </section>
</footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="js/scripts.js"></script>
    </body>
</html>
